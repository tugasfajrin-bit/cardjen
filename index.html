<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Your Card</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f7ede2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* 148mm x 105mm Landscape Proportion Container */
        .card-container {
            width: 90vw;
            max-width: 480px;
            aspect-ratio: 148 / 105; /* Matches your exact 148mm x 105mm image ratio */
            perspective: 1200px;
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Slide Control Styles for 3 steps */
        .card-page {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            transition: all 0.8s ease-in-out;
            background: #fff;
        }

        .card-page img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps image whole without cropping it */
            background-color: #fff; 
        }

        /* Interaction States */
        .hidden-page {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9) translateY(20px);
        }

        .active-page {
            opacity: 1;
            z-index: 5;
            transform: scale(1) translateY(0);
        }

        /* Tap overlay message */
        .action-hint {
            margin-top: 25px;
            padding: 10px 25px;
            background: #f28482;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(242, 132, 130, 0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Background Audio File -->
    <audio id="bgMusic" src="song.mp3" loop preload="auto"></audio>

    <!-- The Interactive Card Box -->
    <div class="card-container" onclick="advanceCard()">
        
        <!-- PAGE 1: FRONT COVER -->
        <div id="page1" class="card-page active-page">
            <img src="front.png" alt="Card Front">
        </div>

        <!-- PAGE 2: MIDDLE REVEAL -->
        <div id="page2" class="card-page hidden-page">
            <img src="middle.png" alt="Card Middle">
        </div>

        <!-- PAGE 3: INSIDE FINAL -->
        <div id="page3" class="card-page hidden-page">
            <img src="inside.png" alt="Card Inside">
        </div>

    </div>

    <!-- Status Button Label underneath -->
    <button id="hintBtn" class="action-hint">tap to open card ✉️❤️</button>

    <script>
        let currentStep = 1;

        function advanceCard() {
            const music = document.getElementById('bgMusic');
            const p1 = document.getElementById('page1');
            const p2 = document.getElementById('page2');
            const p3 = document.getElementById('page3');
            const hint = document.getElementById('hintBtn');

            if (currentStep === 1) {
                // Play music on first physical click
                music.play().catch(e => console.log("Audio waiting for stronger tap:", e));
                
                // Transition to middle image
                p1.className = "card-page hidden-page";
                p2.className = "card-page active-page";
                hint.innerText = "pencet lagi";
                currentStep = 2;
            } else if (currentStep === 2) {
                // Transition to inside image
                p2.className = "card-page hidden-page";
                p3.className = "card-page active-page";
                hint.innerText = "hehe love u";
                currentStep = 3;
            } else {
                // Loop back to the front cover if they keep clicking
                p3.className = "card-page hidden-page";
                p1.className = "card-page active-page";
                hint.innerText = "tap to open card ✉️❤️";
                currentStep = 1;
            }
        }
    </script>
</body>
</html>
